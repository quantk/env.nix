# ==========================================================
# Hyprland для экрана входа — минимальный композитор под ReGreet
# (вместо cage: родные 144 Гц, курсор Bibata, анимация появления)
# Строка exec-once с regreet дописывается в default.nix
# ==========================================================

monitor = HDMI-A-2, 2560x1440@143.97, 0x0, 1
monitor = , preferred, auto, 1             # любой другой — как есть

env = XCURSOR_THEME, Bibata-Modern-Ice
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, Bibata-Modern-Ice
env = HYPRCURSOR_SIZE, 24

input {
  kb_layout  = us,ru
  kb_variant = ,winkeys
  kb_options = grp:caps_toggle,grp_led:caps
  numlock_by_default = true
}

general {
  gaps_in  = 0
  gaps_out = 0
  border_size = 0
}

decoration {
  rounding = 0
  shadow:enabled = false
  blur:enabled = false
}

# Окно greeter'а «проявляется» из тёмного фона с лёгким зумом
animations {
  enabled = true
  bezier = out, 0.16, 1, 0.3, 1
  animation = windowsIn, 1, 9, out, popin 92%
  animation = fadeIn, 1, 10, out
  animation = fadeOut, 1, 6, out
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
  background_color = rgb(0f0e1a)           # цвет фона «Twilight» до появления окна
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

windowrule {
  name = greeter-fullscreen
  match:class = apps.regreet

  fullscreen = on
}
