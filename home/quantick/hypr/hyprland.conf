# Hyprland Configuration

## General Settings
beamout-on-switch = yes
disable_hyprland_logo = yes
vfr = 60

# Set $mod to SUPER (Windows/Command key)
$mod = SUPER

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

## Move focus in vim style
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

## Key Bindings
bind = $mod, Return, exec, kitty 		            	# terminal
bind = $mod, A, exec, wofi --show drun -G		      # Application launcher (Wofi)
bind = $mod, Q, killactive   				              # Close focused window
bind = $mod|Shift, Q, exec, hyprctl dispatch exit	# Quit Hyprland session
bind = $mod SHIFT, L, exec, hyprlock   			      # Lock the screen 
bind = $mod, F, fullscreen, 1                     # Pseudo full screen
bind = CTRL ALT, Delete, exec, wlogout
bind = , Print, exec, flameshot gui

## Autostart Applications
exec-once = hyprpaper 					                        # wallpapers
exec-once = waybar 
exec-once = mako					                              # notifications
exec-once = thunderbird --headless
exec-once = Telegram -startintray
exec-once = hyprsunset
#exec-once = ${pkgs.hyprpolkitagent}/bin/hyprpolkitagent	# Start Hyprland polkit agent for GUI sudo

general {
  border_size = 2
}

monitor = DP-5,2560x1440@165.00,0x0,1 

input {
  follow_mouse = yes
  kb_layout = us,ru
  kb_variant = ,winkeys
  kb_options = grp:caps_toggle,grp_led:caps
}

windowrule {
  name = telegram-on-fifth
  match:class = org.telegram.desktop

  workspace = 5
}

animations {
  enabled = yes

  bezier = swift, 0.20, 1.00, 0.20, 1.00
  bezier = soft,  0.25, 0.90, 0.20, 1.00

  animation = windows,    1, 4, swift, slide
  animation = windowsIn,  1, 4, swift, popin 85%
  animation = windowsOut, 1, 3, soft,  popin 75%
  animation = windowsMove,1, 3, swift

  animation = fade,       1, 3, soft
  animation = fadeSwitch, 1, 3, soft
  animation = fadeShadow, 1, 3, soft
  animation = border,     1, 4, soft

  animation = layers,     1, 3, soft
  animation = workspaces, 1, 4, swift, slide
}

