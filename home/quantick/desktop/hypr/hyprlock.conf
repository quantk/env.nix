# ==========================================================
# Hyprlock — экран блокировки (SUPER+SHIFT+L)
# Палитра «Twilight», как у Hyprland/waybar
# ==========================================================
general {
  grace = 1                    # секунда на «передумать» без пароля
  hide_cursor = true
}

# Размытые и притемнённые обои
background {
  monitor =
  path = /home/quantick/Pictures/main.jpg
  blur_passes = 3
  blur_size = 8
  noise = 0.015
  brightness = 0.65
  vibrancy = 0.2
}

# Часы
label {
  monitor =
  text = $TIME
  font_size = 128
  font_family = Inter ExtraBold
  color = rgba(e6e3f5ff)
  shadow_passes = 2
  shadow_size = 6
  shadow_color = rgba(0a081888)
  position = 0, 220
  halign = center
  valign = center
}

# Дата
label {
  monitor =
  text = cmd[update:60000] date +"%A, %-d %B"
  font_size = 22
  font_family = Inter Medium
  color = rgba(b4a7ffee)
  position = 0, 100
  halign = center
  valign = center
}

# Поле пароля
input-field {
  monitor =
  size = 320, 56
  rounding = -1                # пилюля
  outline_thickness = 2
  outer_color = rgba(b4a7ffee) rgba(f5a3d7ee) 45deg
  inner_color = rgba(16142acc)
  font_color = rgba(e6e3f5ff)
  font_family = Inter
  check_color = rgba(8aa4ffee) rgba(b4a7ffee) 45deg
  fail_color = rgba(ff7a93ee)
  fail_text = <i>$FAIL</i>
  capslock_color = rgba(ffc79aee)
  dots_size = 0.22
  dots_spacing = 0.35
  dots_center = true
  fade_on_empty = false
  placeholder_text = <span foreground="##a9a4c9">Пароль…</span>
  hide_input = false
  position = 0, -40
  halign = center
  valign = center
}

# Раскладка под полем
label {
  monitor =
  text = $LAYOUT
  font_size = 13
  font_family = Inter
  color = rgba(a9a4c9cc)
  position = 0, -95
  halign = center
  valign = center
}
