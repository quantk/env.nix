# ╔══════════════════════════════════════════════════════════╗
# ║  Hyprland                                                ║
# ║  Применить без перелогина: hyprctl reload  (алиас hr)    ║
# ║  Проверить ошибки:        hyprctl configerrors           ║
# ╚══════════════════════════════════════════════════════════╝


# ==========================================================
# Мониторы
# ==========================================================
# имя, разрешение@частота, позиция, масштаб  (список: hyprctl monitors)
monitor = HDMI-A-2, 2560x1440@143.97, 0x0, 1


# ==========================================================
# Автозапуск
# ==========================================================
# Передать окружение Wayland в systemd/dbus — без этого
# не работают порталы (скриншаринг, файловые диалоги) под greetd
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start nixos-fake-graphical-session.target

# --- Компоненты сессии ---
exec-once = systemctl --user start hyprpolkitagent   # GUI-запрос пароля (polkit)
exec-once = hyprpaper                                # обои
exec-once = waybar                                   # панель
exec-once = mako                                     # уведомления
exec-once = hyprsunset                               # ночной режим

# --- Приложения в фоне ---
exec-once = thunderbird --headless
exec-once = Telegram -startintray


# ==========================================================
# Ввод
# ==========================================================
input {
  follow_mouse = yes             # фокус следует за мышью

  kb_layout  = us,ru
  kb_variant = ,winkeys
  kb_options = grp:caps_toggle,grp_led:caps   # CapsLock — смена раскладки, LED — индикатор
}


# ==========================================================
# Внешний вид
# ==========================================================
general {
  border_size = 2
}

misc {
  disable_hyprland_logo = true   # без дефолтных обоев с логотипом
}


# ==========================================================
# Анимации
# ==========================================================
animations {
  enabled = yes

  # Кривые: swift — резкий старт, мягкий финиш; soft — для фейдов
  bezier = swift, 0.20, 1.00, 0.20, 1.00
  bezier = soft,  0.25, 0.90, 0.20, 1.00

  # name,        on, скорость, кривая, стиль
  animation = windows,     1, 4, swift, slide
  animation = windowsIn,   1, 4, swift, popin 85%
  animation = windowsOut,  1, 3, soft,  popin 75%
  animation = windowsMove, 1, 3, swift

  animation = fade,        1, 3, soft
  animation = fadeSwitch,  1, 3, soft
  animation = fadeShadow,  1, 3, soft
  animation = border,      1, 4, soft

  animation = layers,      1, 3, soft
  animation = workspaces,  1, 4, swift, slide
}


# ==========================================================
# Правила окон
# ==========================================================
# Telegram всегда открывается на 5-м рабочем столе
windowrule {
  name = telegram-on-fifth
  match:class = org.telegram.desktop

  workspace = 5
}


# ==========================================================
# Клавиши
# ==========================================================
$mod = SUPER

# --- Приложения ---
bind = $mod, Return, exec, ghostty               # терминал
bind = $mod, A,      exec, wofi --show drun -G   # лаунчер
bind = , Print,      exec, flameshot gui         # скриншот области

# --- Окна ---
bind = $mod, Q, killactive                      # закрыть окно
bind = $mod, F, fullscreen, 1                   # «максимизировать» (панель видна)

# Фокус в стиле vim
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Мышь: SUPER + ЛКМ — двигать, SUPER + ПКМ — ресайз
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Сессия ---
bind = $mod SHIFT, L, exec, hyprlock            # заблокировать
bind = $mod SHIFT, Q, exit                      # выйти из Hyprland
bind = CTRL ALT, Delete, exec, wlogout          # меню выключения

# --- Звук (wpctl из PipeWire) ---
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+

# --- Рабочие столы: SUPER + N — перейти ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# --- SUPER + SHIFT + N — перенести окно ---
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
