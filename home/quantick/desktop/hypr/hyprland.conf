# ╔══════════════════════════════════════════════════════════╗
# ║  Hyprland                                                ║
# ║  Применить без перелогина: hyprctl reload  (алиас hr)    ║
# ║  Проверить ошибки:        hyprctl configerrors           ║
# ╚══════════════════════════════════════════════════════════╝


# ==========================================================
# Мониторы
# ==========================================================
# имя, разрешение@частота, позиция, масштаб  (список: hyprctl monitors)
monitor = HDMI-A-2, 2560x1440@143.97, 0x0, 1


# ==========================================================
# Автозапуск
# ==========================================================
# Передать окружение Wayland в systemd/dbus — без этого
# не работают порталы (скриншаринг, файловые диалоги) под greetd
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start nixos-fake-graphical-session.target

# --- Компоненты сессии ---
exec-once = systemctl --user start hyprpolkitagent   # GUI-запрос пароля (polkit)
exec-once = ~/.config/hypr/wallpaper.sh                # обои (живые, иначе hyprpaper)
exec-once = waybar                                   # панель
exec-once = mako                                     # уведомления
exec-once = hyprsunset                               # ночной режим

# --- Приложения в фоне ---
exec-once = thunderbird --headless
exec-once = Telegram -startintray


# ==========================================================
# Ввод
# ==========================================================
input {
  follow_mouse = yes             # фокус следует за мышью

  kb_layout  = us,ru
  kb_variant = ,winkeys
  kb_options = grp:caps_toggle,grp_led:caps   # CapsLock — смена раскладки, LED — индикатор
}


# ==========================================================
# Внешний вид — палитра «Twilight» (из обоев main.jpg)
#   фон #0f0e1a · лаванда #b4a7ff · барвинок #8aa4ff · розовый #f5a3d7
# ==========================================================
general {
  gaps_in  = 6
  gaps_out = 14
  border_size = 2

  # Градиентная рамка; угол крутится анимацией borderangle
  col.active_border   = rgba(b4a7ffff) rgba(8aa4ffff) rgba(f5a3d7ff) 45deg
  col.inactive_border = rgba(2a2840cc)

  resize_on_border = true        # ресайз за рамку мышью
}

decoration {
  rounding       = 14
  rounding_power = 2.6           # «сквиркл» вместо обычной дуги

  inactive_opacity = 0.94
  dim_inactive     = true
  dim_strength     = 0.06        # неактивные окна чуть приглушены

  blur {
    enabled  = true
    size     = 7
    passes   = 3
    noise    = 0.02
    vibrancy = 0.2               # «стекло» сохраняет насыщенность обоев
    popups   = true
  }

  shadow {
    enabled        = true
    range          = 24
    render_power   = 3
    color          = rgba(0a081899)
    color_inactive = rgba(0a081855)
  }
}

animations {
  enabled = true

  bezier = snappy, 0.05, 0.9, 0.1, 1.0
  bezier = quick,  0.15, 0, 0.1, 1

  animation = global,      1, 3,   snappy
  animation = windowsIn,   1, 2.5, snappy, popin 85%
  animation = windowsOut,  1, 2,   quick,  popin 85%
  animation = windowsMove, 1, 3,   snappy
  animation = fade,        1, 2.5, quick
  animation = layers,      1, 2,   quick,  fade
  animation = workspaces,  1, 3,   snappy, slide
  animation = border,      1, 5,   default
}

dwindle {
  preserve_split = true
}

misc {
  disable_hyprland_logo    = true   # без дефолтных обоев с логотипом
  disable_splash_rendering = true
  animate_manual_resizes   = true
  background_color         = rgb(0f0e1a)  # пока грузятся обои — не чёрный
}


# ==========================================================
# Правила окон
# ==========================================================
# Telegram всегда открывается на 5-м рабочем столе
windowrule {
  name = telegram-on-fifth
  match:class = org.telegram.desktop

  workspace = 5
}


# Утилиты — плавающими окнами по центру
windowrule {
  name = float-utils
  match:class = ^(org.pulseaudio.pavucontrol|nm-connection-editor|org.gnome.Calendar)$

  float  = on
  size   = 960 640
  center = on
}


# ==========================================================
# Правила слоёв — «стекло» под панелью, лаунчером, уведомлениями
# ==========================================================
layerrule {
  name = glass-bar
  match:namespace = waybar

  blur = on
  ignore_alpha = 0.2             # не блюрить полностью прозрачные зазоры
}

layerrule {
  name = glass-popups
  match:namespace = ^(wofi|notifications|logout_dialog)$

  blur = on
  ignore_alpha = 0.3
}


# ==========================================================
# Клавиши
# ==========================================================
$mod = SUPER

# --- Приложения ---
bind = $mod, Return, exec, ghostty               # терминал
bind = $mod, A,      exec, wofi --show drun -G   # лаунчер
bind = , Print,      exec, flameshot gui         # скриншот области

# --- Окна ---
bind = $mod, Q, killactive                      # закрыть окно
bind = $mod, F, fullscreen, 1                   # «максимизировать» (панель видна)
bind = $mod, V, togglefloating                  # плавающее / тайловое

# Scratchpad: SUPER+S — показать/спрятать, SUPER+SHIFT+S — убрать окно туда
bind = $mod,       S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Фокус в стиле vim
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Перемещение окон в стиле vim
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Мышь: SUPER + ЛКМ — двигать, SUPER + ПКМ — ресайз
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Сессия ---
bind = $mod SHIFT, Q, exit                      # выйти из Hyprland
bind = CTRL ALT, Delete, exec, wlogout -b 4 -T 380 -B 380   # меню выключения

# --- Звук (wpctl из PipeWire) ---
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bind = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay,        exec, playerctl play-pause
bind = , XF86AudioNext,        exec, playerctl next
bind = , XF86AudioPrev,        exec, playerctl previous

# --- Рабочие столы: SUPER + N — перейти ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# --- SUPER + SHIFT + N — перенести окно ---
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
